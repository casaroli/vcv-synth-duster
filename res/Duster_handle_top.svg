<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="40.64mm" height="128.5mm" viewBox="0 0 40.64 128.5">

  <!-- Transparent background: panel renders the wood block from above
       (handle "on top"), bristles peek out below as procedural dots
       drawn by BristleWidget. -->

  <g id="handle-top">

    <!-- Main wood block: viewed from above. Narrower than the panel so
         bristles have room to peek out on the sides as well as top/bottom. -->
    <rect x="5" y="4" width="30.64" height="104" rx="3"
          fill="#181818" stroke="#000" stroke-width="0.18"/>

    <!-- Top edge highlight (subtle) -->
    <line x1="6" y1="5.5" x2="34.64" y2="5.5"
          stroke="#3a3a3a" stroke-width="0.5" stroke-linecap="round"/>

    <!-- Vertical wood grain (the long direction of the block) -->
    <g fill="none" stroke="#000" opacity="0.55">
      <path d="M4.5,7 Q5,30 4.7,58 T4.8,107" stroke-width="0.12"/>
      <path d="M7.5,7 Q7.2,40 7.6,65 T7.4,107" stroke-width="0.1"/>
      <path d="M11,7  Q11.4,35 10.9,58 T11.1,107" stroke-width="0.12"/>
      <path d="M15,7  Q14.6,42 15.2,62 T14.9,107" stroke-width="0.1"/>
      <path d="M18.5,7 Q18.8,30 18.5,58 T18.7,107" stroke-width="0.12"/>
      <path d="M22,7  Q21.8,45 22.2,70 T22.0,107" stroke-width="0.1"/>
      <path d="M25.5,7 Q25.9,32 25.4,60 T25.6,107" stroke-width="0.12"/>
      <path d="M29,7  Q28.7,40 29.2,65 T28.9,107" stroke-width="0.1"/>
      <path d="M32.5,7 Q32.9,30 32.6,58 T32.7,107" stroke-width="0.12"/>
      <path d="M36,7  Q35.7,42 36.2,67 T36.0,107" stroke-width="0.1"/>
    </g>

    <!-- Lighter grain accents -->
    <g fill="none" stroke="#2a2a2a" opacity="0.5">
      <path d="M6.0,7 Q6.4,35 5.9,60 T6.1,107" stroke-width="0.1"/>
      <path d="M13,7 Q13.4,40 12.9,65 T13.1,107" stroke-width="0.1"/>
      <path d="M27,7 Q26.6,38 27.2,63 T27.0,107" stroke-width="0.1"/>
      <path d="M34,7 Q34.4,35 33.9,60 T34.1,107" stroke-width="0.1"/>
    </g>

    <!-- Dark strip at the bottom edge where bristles attach -->
    <rect x="5" y="105.5" width="30.64" height="2.5" fill="#0a0a0a"/>
    <line x1="5" y1="105.5" x2="35.64" y2="105.5"
          stroke="#000" stroke-width="0.3" opacity="0.7"/>

    <!-- Label plate (matches side panel's style) -->
    <rect x="9.4" y="42" width="21.8" height="5.2" rx="0.4"
          fill="#0d0d0d" stroke="#2c2c2c" stroke-width="0.08"/>

    <!-- DUSTER block letters -->
    <g fill="#dcdcdc">
      <!-- D -->
      <rect x="10.5" y="43.2" width="0.45" height="2.8"/>
      <rect x="10.5" y="43.2" width="1.4" height="0.45"/>
      <rect x="10.5" y="45.55" width="1.4" height="0.45"/>
      <rect x="11.65" y="43.4" width="0.45" height="2.4"/>
      <!-- U -->
      <rect x="12.7" y="43.2" width="0.45" height="2.8"/>
      <rect x="13.95" y="43.2" width="0.45" height="2.8"/>
      <rect x="12.7" y="45.55" width="1.7" height="0.45"/>
      <!-- S -->
      <rect x="15.1" y="43.2" width="1.7" height="0.45"/>
      <rect x="15.1" y="43.2" width="0.45" height="1.45"/>
      <rect x="15.1" y="44.4" width="1.7" height="0.45"/>
      <rect x="16.35" y="44.4" width="0.45" height="1.6"/>
      <rect x="15.1" y="45.55" width="1.7" height="0.45"/>
      <!-- T -->
      <rect x="17.5" y="43.2" width="1.95" height="0.45"/>
      <rect x="18.25" y="43.2" width="0.45" height="2.8"/>
      <!-- E -->
      <rect x="20.15" y="43.2" width="0.45" height="2.8"/>
      <rect x="20.15" y="43.2" width="1.7" height="0.45"/>
      <rect x="20.15" y="44.4" width="1.4" height="0.45"/>
      <rect x="20.15" y="45.55" width="1.7" height="0.45"/>
      <!-- R -->
      <rect x="22.55" y="43.2" width="0.45" height="2.8"/>
      <rect x="22.55" y="43.2" width="1.4" height="0.45"/>
      <rect x="23.5" y="43.4" width="0.45" height="1.3"/>
      <rect x="22.55" y="44.4" width="1.4" height="0.45"/>
      <rect x="23.5" y="44.75" width="0.45" height="1.25"/>
    </g>

  </g>
</svg>
