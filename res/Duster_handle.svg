<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="40.64mm" height="128.5mm" viewBox="0 0 40.64 128.5">

  <!-- Transparent background: no root rect; rack rails will show through.
       Bristles are drawn procedurally by BristleWidget on top of this panel. -->

  <!-- HANDLE -->
  <g id="handle">

    <!-- Dark base strip where bristles enter the handle.
         Drawn over the procedural bristle bases so they appear to come out
         of the handle, not float above it. -->
    <path d="M 1.6 66.5 L 39.04 66.5 L 39.04 70 L 1.6 70 Z" fill="#0a0a0a"/>

    <!-- Main handle body: rounded block with side bulge -->
    <path d="M 1.6 68
             L 39.04 68
             C 39.5 68 39.7 68.4 39.7 68.9
             L 39.7 86
             C 39.7 87.4 39.0 88.4 38.5 89.6
             C 39.0 90.8 39.7 91.8 39.7 93.2
             L 39.7 108
             C 39.7 110 38.2 111 36.4 111
             L 4.24 111
             C 2.44 111 0.94 110 0.94 108
             L 0.94 93.2
             C 0.94 91.8 1.64 90.8 2.14 89.6
             C 1.64 88.4 0.94 87.4 0.94 86
             L 0.94 68.9
             C 0.94 68.4 1.14 68 1.6 68 Z"
          fill="#181818" stroke="#000" stroke-width="0.18"/>

    <!-- Top edge subtle highlight -->
    <line x1="1.7" y1="68.6" x2="38.94" y2="68.6" stroke="#3a3a3a" stroke-width="0.4" stroke-linecap="round"/>

    <!-- Dark wood-grain curves -->
    <g fill="none" stroke="#000" opacity="0.55">
      <path d="M2.2,73 Q15,72.4 25,73.3 T38.4,72.9" stroke-width="0.12"/>
      <path d="M2.2,78 Q13,77.3 23,78.2 T38.4,77.8" stroke-width="0.1"/>
      <path d="M2.2,83 Q17,82.4 27,83.4 T38.4,82.9" stroke-width="0.12"/>
      <path d="M2.2,97 Q14,96.4 26,97.2 T38.4,96.9" stroke-width="0.12"/>
      <path d="M2.2,102 Q16,101.3 28,102.2 T38.4,101.9" stroke-width="0.1"/>
      <path d="M2.2,107.5 Q18,106.7 28,107.6 T38.4,107.2" stroke-width="0.12"/>
    </g>

    <!-- Lighter wood-grain curves -->
    <g fill="none" stroke="#2a2a2a" opacity="0.6">
      <path d="M2.2,75.5 Q15,74.8 25,75.7 T38.4,75.4" stroke-width="0.1"/>
      <path d="M2.2,80.5 Q12,79.8 24,80.7 T38.4,80.4" stroke-width="0.1"/>
      <path d="M2.2,94 Q15,93.3 26,94.2 T38.4,93.9" stroke-width="0.1"/>
      <path d="M2.2,99.5 Q14,98.8 26,99.7 T38.4,99.4" stroke-width="0.1"/>
      <path d="M2.2,104.5 Q17,103.8 27,104.7 T38.4,104.4" stroke-width="0.1"/>
    </g>

    <!-- Bristle-base shadow (under handle's top edge) -->
    <line x1="1.7" y1="67.2" x2="38.94" y2="67.2" stroke="#000" stroke-width="0.4" opacity="0.7"/>

    <!-- Label plate -->
    <rect x="9.4" y="76.3" width="21.8" height="5.2" rx="0.4" fill="#0d0d0d" stroke="#2c2c2c" stroke-width="0.08"/>

    <!-- DUSTER (rectangle-only block letters, light gray) -->
    <g fill="#dcdcdc">
      <!-- D -->
      <rect x="10.5" y="77.5" width="0.45" height="2.8"/>
      <rect x="10.5" y="77.5" width="1.4" height="0.45"/>
      <rect x="10.5" y="79.85" width="1.4" height="0.45"/>
      <rect x="11.65" y="77.7" width="0.45" height="2.4"/>
      <!-- U -->
      <rect x="12.7" y="77.5" width="0.45" height="2.8"/>
      <rect x="13.95" y="77.5" width="0.45" height="2.8"/>
      <rect x="12.7" y="79.85" width="1.7" height="0.45"/>
      <!-- S -->
      <rect x="15.1" y="77.5" width="1.7" height="0.45"/>
      <rect x="15.1" y="77.5" width="0.45" height="1.45"/>
      <rect x="15.1" y="78.7" width="1.7" height="0.45"/>
      <rect x="16.35" y="78.7" width="0.45" height="1.6"/>
      <rect x="15.1" y="79.85" width="1.7" height="0.45"/>
      <!-- T -->
      <rect x="17.5" y="77.5" width="1.95" height="0.45"/>
      <rect x="18.25" y="77.5" width="0.45" height="2.8"/>
      <!-- E -->
      <rect x="20.15" y="77.5" width="0.45" height="2.8"/>
      <rect x="20.15" y="77.5" width="1.7" height="0.45"/>
      <rect x="20.15" y="78.7" width="1.4" height="0.45"/>
      <rect x="20.15" y="79.85" width="1.7" height="0.45"/>
      <!-- R -->
      <rect x="22.55" y="77.5" width="0.45" height="2.8"/>
      <rect x="22.55" y="77.5" width="1.4" height="0.45"/>
      <rect x="23.5" y="77.7" width="0.45" height="1.3"/>
      <rect x="22.55" y="78.7" width="1.4" height="0.45"/>
      <rect x="23.5" y="79.05" width="0.45" height="1.25"/>
    </g>

  </g>
</svg>
